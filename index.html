<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Downloader Pro</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header App -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Media Downloader <span>PRO</span></h1>
          <p>Download universale per Mac</p>
        </div>
      </div>

      <div class="folder-selector">
        <span class="folder-label">Cartella destinazione:</span>
        <button id="btn-change-folder" class="folder-badge" title="Cambia cartella di destinazione">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span id="folder-path">~/Downloads</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
      <!-- Input Section -->
      <section class="input-card glass-panel">
        <div class="input-wrapper">
          <div class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
          </div>
          <input type="text" id="url-input" placeholder="Incolla l'URL del video, audio o file multimediale..." autocomplete="off">
          <button id="btn-paste" class="btn-secondary" title="Incolla dagli Appunti">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
            Incolla
          </button>
          <button id="btn-analyze" class="btn-primary">
            <span id="analyze-spinner" class="spinner hidden"></span>
            <span id="analyze-text">Analizza Media</span>
          </button>
        </div>
      </section>

      <!-- Alert Banner -->
      <div id="alert-banner" class="alert-banner hidden"></div>

      <!-- Preview Section -->
      <section id="preview-section" class="preview-card glass-panel hidden">
        <div class="preview-layout">
          <div class="preview-thumb-container">
            <img id="preview-img" src="" alt="Thumbnail" class="preview-img hidden">
            <div id="preview-fallback-icon" class="preview-fallback-icon">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
              </svg>
            </div>
          </div>

          <div class="preview-details">
            <div class="preview-header">
              <span id="preview-source" class="badge-source">YouTube</span>
              <span id="preview-duration" class="badge-info">03:45</span>
              <span id="preview-size" class="badge-info">15 MB</span>
            </div>
            <h2 id="preview-title" class="preview-title">Titolo del Video Multimediale</h2>
            <p id="preview-url" class="preview-url">https://example.com/video</p>

            <div class="download-options">
              <label for="quality-select" class="option-title">Seleziona Qualità e Formato Video:</label>
              <select id="quality-select" class="quality-dropdown">
                <option value="1080" selected>⭐ 1080p (Full HD)</option>
                <option value="720">🎬 720p (HD)</option>
                <option value="480">📱 480p (SD)</option>
                <option value="best">⚡ Massima Qualità Disponibile</option>
                <option value="mp3">🎵 Solo Audio MP3</option>
              </select>
            </div>

            <div class="preview-actions">
              <button id="btn-download-now" class="btn-action">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Avvia Download
              </button>
              <button id="btn-copy-link" class="btn-secondary" title="Copia il link dello stream/file negli appunti">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span id="copy-link-text">Copia Link Stream</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Active Downloads Section -->
      <section id="active-downloads-section" class="active-section glass-panel hidden">
        <h3 class="section-title">Download In Corso</h3>
        <div id="active-downloads-list" class="downloads-list"></div>
      </section>

      <!-- Downloads History Library -->
      <section class="history-section glass-panel">
        <div class="history-header">
          <h3 class="section-title">Cronologia Download</h3>
          <span id="history-count" class="count-badge">0 file</span>
        </div>

        <div id="history-empty" class="history-empty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <p>Nessun download completato. Inserisci un link in alto per iniziare!</p>
        </div>

        <div id="history-list" class="history-list hidden"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
