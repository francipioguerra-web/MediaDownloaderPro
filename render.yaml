services:
  - type: web
    name: streamingcommunity
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: DOWNLOADS_DIR
        value: /app/data/downloads
      - key: WATCHPARTY_LOCAL_ONLY
        value: "1"
